{{define "cart-item"}}
<div class="flex items-center gap-3 py-3 border-b border-border">
    <div class="w-11 h-11 rounded-lg bg-surface-alt border border-border overflow-hidden shrink-0 flex items-center justify-center text-text-secondary">
        {{if .ImageURL}}
        <img src="{{.ImageURL}}" alt="{{.Name}}" class="w-full h-full object-cover" />
        {{else}}
        {{template "icon-product-outline"}}
        {{end}}
    </div>
    <div class="flex-1 min-w-0">
        <p class="text-sm text-text-primary truncate">{{.Name}}</p>
        <p class="text-sm text-text-secondary font-display">{{.Price}}</p>
    </div>
    <div class="flex items-center gap-2 shrink-0">
        <button class="w-8 h-8 rounded-lg border border-border flex items-center justify-center text-text-secondary hover:border-accent hover:text-accent p-1">
            {{template "icon-minus-outline"}}
        </button>
        <span class="w-5 text-center text-sm font-medium text-text-primary">{{.Qty}}</span>
        <button class="w-8 h-8 [&>svg]:w-full [&>svg]:h-full rounded-lg border border-border flex items-center justify-center text-text-secondary hover:border-accent hover:text-accent p-1">
            {{template "icon-plus-outline"}}
        </button>
    </div>
</div>
{{end}}
