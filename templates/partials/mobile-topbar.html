{{define "mobile-topbar"}}
<header id="mobile-topbar-wrapper" class="md:hidden fixed top-2 left-2 right-2 h-14 bg-surface border border-border rounded-3xl flex items-center justify-between px-4 z-40">
    <div id="topbar-default" class="flex items-center justify-between w-full">
        <h1 class="text-xl font-display font-semibold text-text-primary">{{.PageTitle}}</h1>
        <div class="flex items-center gap-4">
            {{range .HeaderActions}}
            <button onclick="tapFeedback(); {{.OnClick}}" class="text-text-primary hover:text-text-primary">
                {{if eq .Icon "search"}}{{template "icon-search-outline"}}
                {{else if eq .Icon "scan"}}{{template "icon-scan-outline"}}
                {{else if eq .Icon "theme"}}{{template "icon-theme-toggle"}}
                {{else if eq .Icon "bell"}}{{template "icon-bell-outline"}}
                {{end}}
            </button>
            {{end}}
        </div>
    </div>

    <div id="topbar-search" class="hidden items-center gap-2 w-full">
        <span class="text-text-secondary">{{template "icon-search-outline"}}</span>
        <input type="text" id="page-search-input" oninput="onPageSearch()" placeholder="Search..."
            class="flex-1 bg-transparent text-sm font-medium text-text-secondary placeholder:text-text-secondary/60 focus:outline-none" />
        <button onclick="closePageSearch()" class="text-text-secondary">
            {{template "icon-close-outline"}}
        </button>
    </div>
</header>
{{end}}
