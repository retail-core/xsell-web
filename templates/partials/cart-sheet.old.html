{{define "cart-sheet.old"}}
    <div id="cart-sheet-backdrop" onclick="closeCartSheet()" class="hidden fixed inset-0 bg-black/50 z-50"></div>
    <div id="cart-sheet" class="fixed left-0 right-0 bottom-0 bg-surface border-t border-border rounded-t-2xl z-50 translate-y-full transition-transform duration-200 ease-out max-h-[85vh] flex flex-col">
       
        <!-- Default cart view -->
        <div id="cart-default-view">
            <div class="flex items-center justify-between px-4 py-4 border-b border-border shrink-0">
                <p class="text-sm font-semibold text-text-primary">Current Order</p>
                <button onclick="closeCartSheet()" class="text-text-secondary">{{template "icon-close-outline"}}</button>
            </div>
            <div id="cart-items-container" class="flex-1 overflow-y-auto px-4">
                <div class="flex items-center justify-center py-16 text-sm text-text-secondary">No item selected</div>
            </div>
            <div class="px-4 pb-3 shrink-0">
                <div class="flex bg-surface-alt rounded-xl p-1 gap-1">
                    <button data-method="CASH"
                            onclick="selectPaymentMethod('CASH')"
                            class="payment-tab flex-1 text-sm font-medium py-2 rounded-lg bg-surface text-accent shadow-sm">Cash</button>
                    <button data-method="TRANSFER"
                            onclick="selectPaymentMethod('TRANSFER')"
                            class="payment-tab flex-1 text-sm font-medium py-2 rounded-lg text-text-secondary">Transfer</button>
                </div>
            </div>
            <button id="place-order-btn"
                    onclick="submitOrder()"
                    class="mx-4 mb-4 flex items-center justify-between bg-accent text-black rounded-xl px-5 py-4 font-semibold shrink-0">
                <span>Place Order</span>
                <span id="cart-total-display">₦0</span>
            </button>
        </div>

        <!-- Success view -->
        <div id="cart-success-view" class="hidden flex-col items-center justify-center text-center py-16 px-6">
            <div class="w-20 h-20 rounded-full bg-accent-soft text-accent flex items-center justify-center mb-5">
                {{template "icon-check-outline"}}
            </div>
            <h2 class="text-lg font-display font-semibold text-text-primary mb-1">Success</h2>
            <p class="text-sm text-text-secondary">Your sale has been recorded</p>
        </div>
        
    </div>
{{end}}
