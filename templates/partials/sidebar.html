{{define "sidebar"}}
<aside
    class="hidden md:flex fixed left-0 top-0 h-screen w-[72px] hover:w-60 bg-surface border-r border-border flex-col justify-between transition-all duration-200 ease-out overflow-hidden group z-40">
    <div>
        <div class="flex items-center h-16 px-5 border-b border-border">
            <span class="text-lg font-bold text-accent">x</span>
            <span
                class="text-lg font-bold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-150">Sell</span>
        </div>

        <nav class="mt-4 flex flex-col gap-1 px-3">
            {{range .NavItems}}
            <a href="{{.Href}}"
                class="flex items-center gap-3 px-2.5 py-2.5 rounded-lg text-sm {{if .Active}}bg-accent-soft text-accent font-medium{{else}}text-text-secondary hover:bg-surface-alt hover:text-text-primary{{end}}">
                <span class="text-lg w-6 flex justify-center shrink-0">{{.Icon}}</span>
                <span
                    class="whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-150">{{.Label}}</span>
            </a>
            {{end}}
        </nav>
    </div>

    <div class="px-3 pb-4">
        <a href="/account"
            class="flex items-center gap-3 px-2.5 py-2.5 rounded-lg text-sm text-text-secondary hover:bg-surface-alt hover:text-text-primary">
            <span
                class="w-6 h-6 rounded-full bg-accent-soft text-accent flex items-center justify-center text-xs font-semibold shrink-0">OS</span>
            <span class="whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-150">Obimba
                Smart</span>
        </a>
    </div>
</aside>
{{end}}
