{{define "store-switcher-sheet"}}
<div id="store-sheet-backdrop" onclick="toggleStoreSwitcher()" class="hidden fixed inset-0 bg-black/50 z-50"></div>

<div id="store-sheet" class="fixed left-0 right-0 bottom-0 bg-surface border-t border-border rounded-t-2xl z-50 translate-y-full transition-transform duration-200 ease-out max-h-[70vh] flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-border shrink-0">
        <h2 class="text-base font-semibold text-text-primary">Your Stores</h2>
        <button onclick="toggleStoreSwitcher()" class="text-text-secondary">
            {{template "icon-close-outline"}}
        </button>
    </div>

    <div id="store-sheet-body" class="overflow-y-auto px-4 py-2">
        <p class="text-sm text-text-secondary text-center py-6">Loading stores...</p>
    </div>

   
    <div class="p-4 border-t border-border shrink-0">
         {{if .IsOwner}}
        <a href="/stores/new" class="w-full flex items-center justify-center gap-2 border border-dashed border-border rounded-xl py-3 text-sm font-medium text-text-secondary hover:border-accent hover:text-accent">
            {{template "icon-plus-outline"}}
            Add New Store
        </a>
        {{end}}
    </div>
</div>
{{end}}
