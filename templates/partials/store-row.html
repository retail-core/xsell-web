{{define "store-row"}}
<button class="w-full flex items-center justify-between p-3 rounded-xl {{if .Active}}bg-accent-soft{{else}}hover:bg-surface-alt{{end}} mb-1">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-surface-al {{if .Active}}text-accent{{else}}text-text-secondary{{end}} flex items-center justify-center shrink-0">
            {{template "icon-location-outline"}}
        </div>
        <div class="text-left min-w-0">
            <p class="text-sm font-medium text-text-primary truncate">{{.Name}}</p>
            <p class="text-xs text-text-secondary">{{.Location}}</p>
        </div>
    </div>
    {{if .Active}}
    <span class="text-accent shrink-0">{{template "icon-check-outline"}}</span>
    {{end}}
</button>
{{end}}
