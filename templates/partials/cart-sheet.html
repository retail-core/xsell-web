{{define "cart-sheet"}}
    <div id="cart-sheet-backdrop" onclick="closeCartSheet()" class="hidden fixed inset-0 bg-black/50 z-50"></div>
    <div id="cart-sheet"
         class="fixed left-0 right-0 bottom-0 bg-surface border-t border-border rounded-t-2xl z-50 translate-y-full transition-transform duration-200 ease-out max-h-[85vh] flex flex-col">
        <!-- Default cart view -->
        <div id="cart-default-view" class="flex flex-col" style="max-height: 85vh;">
            <!-- Order header -->
            <div class="flex items-center justify-between px-4 py-4 border-b border-border shrink-0">
                <div class="flex items-center gap-3">
                    <span class="text-text-secondary">{{template "icon-sale-outline"}}</span>
                    <div class="text-left">
                        <p class="text-xs text-text-secondary">Order Number</p>
                        <p class="text-sm font-semibold text-text-primary">{{.Cart.OrderNumber}}</p>
                    </div>
                </div>
                <button onclick="closeCartSheet()"><span class="text-text-secondary">{{template "icon-chevron-down"}}</span></button>
            </div>
            <!-- Items -->
            <div id="cart-items-container" class="flex-1 overflow-y-auto px-4">
                <div class="flex items-center justify-center py-16 text-sm text-text-secondary">No item selected</div>
            </div>
            <!-- Print receipt -->
            <div class="flex items-center px-4 py-3 border-t border-border shrink-0 gap-2 mt-4">
                <button type="button"
                        onclick="tapFeedback(); toggleSwitch(this)"
                        data-on="true"
                        class="relative w-11 h-6 rounded-full bg-accent transition-colors shrink-0">
                    <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform translate-x-5"></span>
                </button>
                <span class="text-xs text-text-primary">Print Receipt</span>
            </div>
            <!-- Payment method -->
            <div class="px-3 pb-3 shrink-0">
                <div class="flex bg-surface-alt rounded-xl p-1 gap-1">
                    <button data-method="CASH"
                            onclick="selectPaymentMethod('CASH')"
                            class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl text-text-secondary hover:border hover:border-accent">Cash</button>
                    <button data-method="TRASNFER"
                            onclick="selectPaymentMethod('TRANSFER')"
                            class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl bg-surface text-accent shadow-sm hover:border hover:border-accent">Transfer</button>
                    <!-- <button data-method="credit"
                            onclick="selectPaymentMethod('credit')"
                            class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl text-text-secondary hover:border hover:border-accent">Credit</button> -->
                </div>
            </div>
            <!-- Place order -->
            <button onclick="submitOrder()"
                    id="place-order-btn"
                    class="mx-4 mb-4 flex items-center justify-between bg-accent text-black rounded-xl px-5 py-3 font-semibold shrink-0">
                <span>Place Order</span>
                <span id="cart-total-display" class="text-2xl font-extrabold font-display">₦0</span>
            </button>
        </div>
        <!-- Success view -->
        <div id="cart-success-view" class="hidden flex-col items-center justify-center text-center py-16 px-6">
            <div class="w-20 h-20 rounded-full bg-accent-soft text-accent flex items-center justify-center mb-5">
                {{template "icon-check-outline"}}
            </div>
            <h2 class="text-lg font-display font-semibold text-text-primary mb-1">Success</h2>
            <p class="text-sm text-text-secondary">Your sale has been recorded</p>
        </div>
    </div>
{{end}}
