{{define "cart-sheet"}}
<div id="cart-sheet-backdrop" onclick="toggleCartSheet()" class="hidden fixed inset-0 bg-black/50 z-50"></div>

<div id="cart-sheet" class="fixed left-0 right-0 bottom-0 bg-surface border-t border-border rounded-t-2xl z-50 translate-y-full transition-transform duration-200 ease-out max-h-[85vh] flex flex-col">

    <!-- Order header -->
    <div class="flex items-center justify-between px-4 py-4 border-b border-border shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-text-secondary">{{template "icon-sale-outline"}}</span>
            <div class="text-left">
                <p class="text-xs text-text-secondary">Order Number</p>
                <p class="text-sm font-semibold text-text-primary">{{.Cart.OrderNumber}}</p>
            </div>
        </div>
        <button onclick="toggleCartSheet()"><span class="text-text-secondary">{{template "icon-chevron-down"}}</span></button>
    </div>

    <!-- Items -->
    <div class="flex-1 overflow-y-auto px-4">
        {{if .Cart.Items}}
        {{range .Cart.Items}}
        {{template "cart-item" .}}
        {{end}}
        {{else}}
        <div class="flex items-center justify-center py-16 text-sm text-text-secondary">
            No item selected
        </div>
        {{end}}
    </div>

    <!-- Print receipt -->
   <div class="flex items-center  px-4 py-3 border-t border-border shrink-0 gap-2 mt-4">
    <button type="button" onclick="toggleSwitch(this)"
        data-on="true"
        class="relative w-11 h-6 rounded-full bg-accent transition-colors shrink-0">
        <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform translate-x-5"></span>
    </button>

    <span class="text-xs text-text-primary">Print Receipt</span>
    
    </div>

    <!-- Payment method -->
    <div class="px-3 pb-3 shrink-0">
        <div class="flex bg-surface-alt rounded-xl p-1 gap-1">
            <button data-method="cash" onclick="selectPaymentMethod('cash')" class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl text-text-secondary hover:border hover:border-accent">Cash</button>
            <button data-method="transfer" onclick="selectPaymentMethod('transfer')" class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl bg-surface text-accent shadow-sm hover:border hover:border-accent">Transfer</button>
            <button data-method="credit" onclick="selectPaymentMethod('credit')" class="payment-tab flex-1 text-sm font-medium py-2 rounded-xl text-text-secondary hover:border hover:border-accent">Credit</button>
        </div>
    </div>

    <!-- Place order -->
    <button class="mb-0 flex items-center justify-between bg-accent text-black rounded-t-3xl px-5 py-4 font-semibold shrink-0">
        <span class="text-base">Place Order</span>
        <span class="text-2xl font-extrabold font-display">{{.Cart.Total}}</span>
    </button>

</div>
<script>
  function toggleSwitch(btn) {
    const isOn = btn.dataset.on === "true";
    btn.dataset.on = (!isOn).toString();
    btn.classList.toggle("bg-accent", !isOn);
    btn.classList.toggle("bg-border", isOn);
    btn.querySelector("span").classList.toggle("translate-x-5", !isOn);
    btn.querySelector("span").classList.toggle("translate-x-0.5", isOn);
  }
</script>
{{end}}
