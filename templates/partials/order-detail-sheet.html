{{define "order-detail-sheet"}}
<div id="order-backdrop" onclick="closeOrderDetail()" class="hidden fixed inset-0 bg-black/50 z-50"></div>

<div id="order-sheet" class="fixed left-0 right-0 bottom-0 bg-surface border-t border-border rounded-t-2xl z-50 translate-y-full transition-transform duration-200 ease-out max-h-[88vh] flex flex-col">

    <div class="flex items-start justify-between p-4 border-b border-border shrink-0">
        <div>
            <h2 id="order-id" class="text-base font-display font-semibold text-text-primary"></h2>
            <p id="order-sold-by" class="text-sm text-text-secondary mt-1"></p>
            <p id="order-datetime" class="text-xs text-text-secondary mt-0.5"></p>
        </div>
        <button onclick="closeOrderDetail()" class="text-text-secondary shrink-0">
            {{template "icon-close-outline"}}
        </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4">
        <div id="order-items" class="space-y-3 pb-4 border-b border-border"></div>

        <div class="pt-4 space-y-2.5">
            <div class="flex items-center justify-between">
                <span class="text-sm text-text-secondary">Subtotal</span>
                <span id="order-subtotal" class="text-sm font-display font-semibold text-text-primary"></span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm text-text-secondary">Payment Method</span>
                <span id="order-payment-badge"></span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm text-text-secondary">Status</span>
                <span id="order-status-badge"></span>
            </div>
        </div>

        <div id="order-credit-section" class="hidden mt-4 pt-4 border-t border-border">
            <p class="text-xs text-text-secondary mb-2">Credit to</p>
            <div class="flex items-center gap-2">
                <div id="order-credit-avatar" class="w-8 h-8 rounded-full bg-accent-soft text-accent flex items-center justify-center text-xs font-semibold"></div>
                <span id="order-credit-name" class="text-sm font-medium text-text-primary"></span>
            </div>
        </div>
    </div>

    <div class="p-4 border-t border-border shrink-0">
        <button class="w-full flex items-center justify-center gap-2 border border-border rounded-xl py-3 text-sm font-medium text-text-primary hover:border-accent">
            {{template "icon-sale-outline"}}
            Print Receipt
        </button>
        <!-- <button class="flex-1 flex items-center justify-center gap-2 border border-danger/30 rounded-xl py-3 text-sm font-medium text-danger hover:bg-danger-soft">
            {{template "icon-search-outline"}}
            Refund
        </button> -->
    </div>
</div>
{{end}}
